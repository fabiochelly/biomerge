[package]
name = "biomerge-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encoding_rs = "0.8.44"
globset = "0.4.21"
ignore = "0.4.34"
imara-diff = "0.2.0"
quick-xml = "0.41"
rayon = "1.12.0"
regex = "1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
thiserror = "2.0.21"
trash = "5.2.9"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-normalization = "0.1.26"
unicode-width = "0.2"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
